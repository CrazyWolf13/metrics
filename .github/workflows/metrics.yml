name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: CrazyWolf13/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Europe/Zurich
          base: header
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_stars: yes
          plugin_sponsorships: yes
          plugin_followup: yes
          plugin_activity: yes
          plugin_traffic: yes
          plugin_habits: yes
          plugin_discussions: yes
          config_order: base.header, isocalendar, languages, stars, sponsorships, followup, activity, traffic, habits, discussion
